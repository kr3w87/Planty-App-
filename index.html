<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planty</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main><header><div><small>PLANTY</small><h1>Deine Pflanzen</h1></div><button id="logoutBtn">Abmelden</button></header><section id="login" class="card hidden"><h2>Anmelden</h2><input id="email" type="email" placeholder="E-Mail"><input id="password" type="password" placeholder="Passwort"><button id="loginBtn">Einloggen</button><p id="authMsg"></p></section><section id="app" class="hidden"><section class="card"><h2>Neue Pflanze</h2><label>Pflanze suchen</label><input id="search" type="search" placeholder="z. B. Monstera, Palme oder Ficus …" autocomplete="off"><div id="results"></div><div id="selected" class="selected hidden"><b id="selName"></b><span id="selBotanical"></span></div><label>Eigener Name</label><input id="name" placeholder="z. B. Wohnzimmer-Monstera"><label>Standort</label><input id="location" placeholder="z. B. Wohnzimmer"><label>Foto</label><input id="photo" type="file" accept="image/*"><div class="grid"><div><label>Licht</label><input id="light" readonly></div><div><label>Gießen alle (Tage)</label><input id="watering" type="number" min="1"></div><div><label>Düngen alle (Tage)</label><input id="fertilizing" type="number" min="1"></div></div><textarea id="notes" placeholder="Notizen …"></textarea><button id="add">Pflanze hinzufügen</button><p id="status"></p></section><h2>Meine Pflanzen <span id="count"></span></h2><div id="plants"></div></section></main><script src="plant-database.js"></script><script src="app.js"></script></body></html>
