<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planty V2.2</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="auth"><div class="box"><div class="brand">⌁ PLANTY</div><p>Deine Pflanzen. Deine Pflege.</p><h1 id="title">Willkommen zurück</h1><form id="authForm"><input id="email" type="email" placeholder="E-Mail" required><input id="password" type="password" placeholder="Passwort" minlength="6" required><button id="authBtn">ANMELDEN</button></form><button class="link" id="mode">Noch kein Konto? Registrieren</button><small id="authMsg"></small></div></div>
<div id="app" class="hidden"><header><div><b>⌁ PLANTY</b><small>Deine Pflanzen. Deine Pflege.</small></div><button class="icon" id="logout">↪</button></header><main><p class="eyebrow">DEIN GRÜNES ZUHAUSE</p><div class="titleRow"><div><h1>Deine Pflanzen</h1><p id="welcome"></p></div><strong id="count">0</strong></div><div class="stats"><div>💧<b id="water">0</b><small>Heute gießen</small></div><div>🌱<b id="fert">0</b><small>Bald düngen</small></div><div>🩺<b id="issues">0</b><small>Beobachten</small></div></div><h2>Heute zu tun</h2><div id="tasks"></div><div class="secthead"><h2>Deine Pflanzen</h2><button class="link" id="add">＋ Hinzufügen</button></div><div id="plants" class="grid"></div></main></div>
<div id="modal" class="modal hidden"><div class="sheet"><div class="secthead"><h2>Neue Pflanze</h2><button class="close" id="close">×</button></div><form id="plantForm"><label>Pflanze auswählen</label><select id="plantType" required><option value="">Bitte auswählen…</option></select><div id="plantInfo" class="plantInfo hidden"></div><label>Eigener Name <small>(optional)</small></label><input id="name" placeholder="z. B. Meine Monstera"><label>Foto<input id="plantPhoto" type="file" accept="image/*" capture="environment"></label><div id="preview" class="preview">🌿</div><input id="location" placeholder="Standort, z. B. Wohnzimmer"><textarea id="notes" placeholder="Notizen"></textarea><button class="primary">Pflanze speichern</button><small id="saveMsg"></small></form></div></div>
<div id="detail" class="modal hidden"><div class="sheet"><div class="secthead"><h2 id="detailName"></h2><button class="close" id="detailClose">×</button></div><div id="detailBody"></div></div></div>
<div id="photoModal" class="modal hidden"><div class="sheet"><div class="secthead"><h2>Wachstum dokumentieren</h2><button class="close" id="photoClose">×</button></div><form id="photoForm"><input id="growthPhoto" type="file" accept="image/*" capture="environment" required><input id="growthNote" placeholder="Notiz, z. B. neues Blatt"><button class="primary">Foto speichern</button><small id="photoMsg"></small></form></div></div>
<div id="healthModal" class="modal hidden"><div class="sheet"><div class="secthead"><h2>Gesundheitsnotiz</h2><button class="close" id="healthClose">×</button></div><form id="healthForm"><select id="problem"><option>Gelbe Blätter</option><option>Schädlinge</option><option>Trockene Blätter</option><option>Wurzelfäule</option><option>Wachstumsproblem</option><option>Beobachtung</option><option>Sonstiges</option></select><select id="severity"><option>Niedrig</option><option selected>Mittel</option><option>Hoch</option></select><textarea id="description" placeholder="Was ist dir aufgefallen?"></textarea><button class="primary">Eintrag speichern</button></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><div style="text-align:center;opacity:.55;font-size:.75rem;margin:24px 0 8px;">Planty V2.4</div>
<div style="text-align:center;opacity:.5;font-size:.72rem;margin:24px 0 8px;">Planty V2.5</div></body></html>
